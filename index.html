<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Resizer (1600x1200)</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background-color: #1e293b;
      border-radius: 12px;
      padding: 32px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      text-align: center;
    }
    h1 {
      margin-top: 0;
      font-size: 1.5rem;
      color: #f8fafc;
    }
    p {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 24px;
    }
    .dropzone {
      border: 2px dashed #475569;
      border-radius: 8px;
      padding: 40px 20px;
      cursor: pointer;
      transition: all 0.2s ease;
      background-color: #0f172a;
    }
    .dropzone:hover {
      border-color: #38bdf8;
      background-color: #1e293b;
    }
    input[type="file"] {
      display: none;
    }
    .btn {
      background-color: #0284c7;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      display: inline-block;
      margin-top: 16px;
      text-decoration: none;
    }
    .btn:hover {
      background-color: #0369a1;
    }
    .btn:disabled {
      background-color: #475569;
      cursor: not-allowed;
    }
    #preview-container {
      margin-top: 24px;
      display: none;
    }
    canvas {
      max-width: 100%;
      height: auto;
      border-radius: 6px;
      border: 1px solid #334155;
      background-color: #000;
    }
    .info {
      margin-top: 12px;
      font-size: 0.85rem;
      color: #38bdf8;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>1600 × 1200 Image Resizer</h1>
    <p>Upload any image. Smaller images will be padded with black to fit 1600×1200. Larger images will be scaled down proportionally to fit inside.</p>

    <div class="dropzone" id="dropzone">
      <div>📁 Click or Drag & Drop Image Here</div>
      <input type="file" id="fileInput" accept="image/*">
    </div>

    <div id="preview-container">
      <canvas id="canvas" width="1600" height="1200"></canvas>
      <div class="info" id="statusInfo">Dimensions: 1600 x 1200 px</div>
      <br>
      <a id="downloadBtn" class="btn" download="resized-1600x1200.png">Download Image</a>
    </div>
  </div>

  <script>
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const previewContainer = document.getElementById('preview-container');
    const downloadBtn = document.getElementById('downloadBtn');
    const statusInfo = document.getElementById('statusInfo');

    const TARGET_WIDTH = 1600;
    const TARGET_HEIGHT = 1200;

    dropzone.addEventListener('click', () => fileInput.click());

    dropzone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropzone.style.borderColor = '#38bdf8';
    });

    dropzone.addEventListener('dragleave', () => {
      dropzone.style.borderColor = '#475569';
    });

    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropzone.style.borderColor = '#475569';
      if (e.dataTransfer.files.length) {
        processImage(e.dataTransfer.files[0]);
      }
    });

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length) {
        processImage(e.target.files[0]);
      }
    });

    function processImage(file) {
      if (!file.type.startsWith('image/')) {
        alert('Please select an image file.');
        return;
      }

      const img = new Image();
      img.src = URL.createObjectURL(file);

      img.onload = () => {
        // Clear canvas and set black background
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, TARGET_WIDTH, TARGET_HEIGHT);

        let drawWidth = img.width;
        let drawHeight = img.height;

        // Scale down if image is larger than target canvas in any dimension
        if (drawWidth > TARGET_WIDTH || drawHeight > TARGET_HEIGHT) {
          const scale = Math.min(TARGET_WIDTH / drawWidth, TARGET_HEIGHT / drawHeight);
          drawWidth = drawWidth * scale;
          drawHeight = drawHeight * scale;
        }

        // Calculate centering coordinates
        const x = (TARGET_WIDTH - drawWidth) / 2;
        const y = (TARGET_HEIGHT - drawHeight) / 2;

        // Draw image onto canvas
        ctx.drawImage(img, x, y, drawWidth, drawHeight);

        // Update download link and preview UI
        downloadBtn.href = canvas.toDataURL('image/png');
        downloadBtn.download = `resized_${file.name.replace(/\.[^/.]+$/, "")}.png`;
        statusInfo.textContent = `Original: ${img.width}x${img.height} → Canvas: 1600x1200 (Centered & Padded)`;
        previewContainer.style.display = 'block';

        URL.revokeObjectURL(img.src);
      };
    }
  </script>
</body>
</html>
